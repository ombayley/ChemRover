# XGBoost regressor. Everything except `_target_`, `name` and `load_from` is passed to xgboost.XGBRegressor.
_target_: chemrover.models.xgb.XGB
name: absorbance_model       # used for the saved model file and the Optuna study name
load_from: null              # path to a saved model .json to reuse instead of tuning/training
max_depth: 2
learning_rate: 0.02
n_estimators: 1000
subsample: 0.5
colsample_bytree: 0.5
min_child_weight: 3
gamma: 1.0
early_stopping_rounds: 50    # only applied when the tuning (test) split is passed to fit()
n_jobs: 1                    # keep at 1: Optuna runs trials in parallel instead
enable_categorical: True
tree_method: "hist"
