# ---------------------------------------------------------------------------
# Root config. `uv run chemrover` with no arguments runs exactly this.
#
# Each entry in `defaults` picks one file from the matching config folder.
# Override any field on the command line with a dotted path, e.g.
#   uv run chemrover data.subset=2
#   uv run chemrover trainer.n_trials=20
#   uv run chemrover "data.features=[lambda,SMILES]"      # drop solvent
# ---------------------------------------------------------------------------
defaults:
  - model: xgb
  - data: abs
  - trainer: optuna
  - _self_

# All paths are resolved relative to the repo root, so the configs work on any machine.
paths:
  root: ${project_root:}
  data: ${paths.root}/data/raw
  outputs: ${paths.root}/outputs

# Each run writes its log, resolved config, saved model and parity plot here.
hydra:
  run:
    dir: ${paths.outputs}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${paths.outputs}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
