[project]
name = "chemrover"
version = "0.1.0"
description = "ML based predictors for azobenzene photoswitches"
readme = "README.md"
authors = [
    { name = "Olly Bayley", email = "ollybayley1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3.7",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "rdkit>=2026.3.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "xgboost>=3.4.1",
]

[project.scripts]
chemrover = "chemrover:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "N"]   # keep naming checks on in general
ignore = ["N806", "N803"]  # but drop the lowercase-variable/argument rules
